<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Personal Log</title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"
    ></script>

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>
</head>

<body>

    <!-- ==================================================
         AUTH SCREEN
         ================================================== -->

    <div
        id="auth-screen"
        class="auth-screen"
        style="display: none;"
    >

        <div class="auth-card">

            <div class="auth-card-header">
                <span class="eyebrow">
                    SIGN IN
                </span>

                <h1>
                    Personal Log
                </h1>
            </div>

            <form
                id="auth-form"
                class="auth-form"
                autocomplete="off"
            >

                <label
                    class="auth-field"
                    for="auth-email"
                >
                    <span>EMAIL</span>

                    <input
                        id="auth-email"
                        type="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                    >
                </label>

                <label
                    class="auth-field"
                    for="auth-password"
                >
                    <span>PASSWORD</span>

                    <input
                        id="auth-password"
                        type="password"
                        placeholder="••••••••"
                        autocomplete="current-password"
                    >
                </label>

                <div class="auth-actions">
                    <button
                        id="auth-signin-btn"
                        type="submit"
                        class="auth-btn auth-btn--primary"
                    >
                        Sign in
                    </button>

                    <button
                        id="auth-signup-btn"
                        type="button"
                        class="auth-btn auth-btn--ghost"
                    >
                        Create account
                    </button>
                </div>

            </form>

            <p
                id="auth-message"
                class="auth-message"
            ></p>

        </div>

    </div>


    <main class="page" style="display: none;">

        <!-- ==================================================
             TOP BAR
             ================================================== -->

        <header class="top-bar">

            <div class="top-left">
                PERSONAL LOG / 2026
            </div>

            <div class="top-right">
                <span
                    id="user-email"
                    class="user-email"
                ></span>

                <button
                    id="signout-btn"
                    class="signout-btn"
                    title="Sign out"
                >
                    SIGN OUT
                </button>

                DAILY TRACKER
            </div>

        </header>


        <!-- ==================================================
             MONTH HEADER
             ================================================== -->

        <section class="month-header">

            <div class="month-title">

                <span class="eyebrow">
                    MONTH
                </span>

                <h1>Personal Log</h1>

            </div>

            <div class="month-stat">
                <strong>01</strong>
                <span>MONTH</span>
            </div>

            <div class="month-stat">
                <strong>—</strong>
                <span>ENTRIES</span>
            </div>

            <div class="month-stat">
                <strong>—</strong>
                <span>HOURS</span>
            </div>

            <div
                id="streak-stat"
                class="month-stat month-stat--streak"
            >
                <strong id="streak-value">—</strong>
                <span>STREAK</span>

                <div
                    id="streak-tooltip"
                    class="streak-tooltip"
                ></div>

            </div>

        </section>


        <!-- ==================================================
             MAIN CONTENT
             ================================================== -->

        <section class="main-content">


            <!-- =================================================
                 LEFT: DAILY LOG
                 ================================================= -->

            <section class="daily-panel"></section>


            <!-- =================================================
                 RIGHT: CALENDAR ONLY
                 ================================================= -->

            <section class="calendar-panel">

                <div class="calendar-panel-header">

                    <span class="eyebrow">
                        CALENDAR
                    </span>

                    <button
                        id="journal-search-btn"
                        class="journal-search-button"
                        title="Search journal"
                        aria-label="Search journal"
                    >
                        <span class="search-icon"></span>
                    </button>

                </div>

                <div id="calendar"></div>

            </section>

        </section>


        <!-- ==================================================
             STATISTICS / CHARTS
             ================================================== -->

        <section class="stats-section">

            <div class="stats-header">

                <span class="eyebrow">
                    STATISTICS
                </span>

            </div>

            <div id="stats"></div>

        </section>


        <!-- ==================================================
             ACTIVITY FORM
             
             This is an overlay/popup.
             It is opened by the + button in Activities.
             ================================================== -->

        <div
            id="activity-panel"
            class="activity-panel"
        ></div>


    </main>

    <script
        type="module"
        src="./js/auth.js"
    ></script>

</body>

</html>
